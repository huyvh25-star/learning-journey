<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced To-Do List</title>
    <style>
        :root {
            --bg: #f4f6fa;
            --text: #222;
            --card: #fff;
            --primary: #4a90e2;
            --completed: #8bc34a;
        }

        body.dark {
            --bg: #1e1e2f;
            --text: #f5f5f5;
            --card: #2c2c3c;
            --primary: #90caf9;
            --completed: #aed581;
        }

        body {
            font-family: sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
        }

        .container {
            width: 400px;
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .filters,
        .search {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .filters button {
            background: none;
            color: var(--text);
        }

        .filters button.active {
            font-weight: bold;
            color: var(--primary);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: var(--bg);
            cursor: grab;
            transition: transform 0.2s;
        }

        li.dragging {
            opacity: 0.5;
        }

        li.completed span {
            text-decoration: line-through;
            color: var(--completed);
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .dark-toggle {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>To-Do List</h1>
        <div class="controls">
            <input type="text" id="taskInput" placeholder="Thêm công việc...">
            <button id="addBtn">Add</button>
        </div>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Tìm kiếm...">
        </div>
        <div class="filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="active">Active</button>
            <button data-filter="completed">Completed</button>
        </div>
        <ul id="taskList"></ul>
        <div class="dark-toggle">
            <button id="darkModeBtn">🌙 Dark/Light</button>
        </div>
    </div>

    <script>
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");
        const searchInput = document.getElementById("searchInput");
        const filterBtns = document.querySelectorAll(".filters button");
        const darkModeBtn = document.getElementById("darkModeBtn");

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        let filter = "all";

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function renderTasks() {
            taskList.innerHTML = "";
            let filtered = tasks.filter(t => {
                if (filter === "active") return !t.completed;
                if (filter === "completed") return t.completed;
                return true;
            }).filter(t => t.text.toLowerCase().includes(searchInput.value.toLowerCase()));

            filtered.forEach((task, index) => {
                const li = document.createElement("li");
                li.draggable = true;
                li.className = task.completed ? "completed" : "";

                const span = document.createElement("span");
                span.textContent = task.text;
                span.contentEditable = false;
                span.addEventListener("dblclick", () => {
                    span.contentEditable = true;
                    span.focus();
                });
                span.addEventListener("blur", () => {
                    span.contentEditable = false;
                    task.text = span.textContent;
                    saveTasks();
                });

                const actions = document.createElement("div");
                actions.className = "actions";

                const check = document.createElement("input");
                check.type = "checkbox";
                check.checked = task.completed;
                check.addEventListener("change", () => {
                    task.completed = check.checked;
                    saveTasks();
                    renderTasks();
                });

                const del = document.createElement("button");
                del.textContent = "❌";
                del.addEventListener("click", () => {
                    tasks.splice(index, 1);
                    saveTasks();
                    renderTasks();
                });

                actions.appendChild(check);
                actions.appendChild(del);

                li.appendChild(span);
                li.appendChild(actions);

                // Drag & Drop
                li.addEventListener("dragstart", () => {
                    li.classList.add("dragging");
                });
                li.addEventListener("dragend", () => {
                    li.classList.remove("dragging");
                    updateOrder();
                });

                taskList.appendChild(li);
            });
        }

        function updateOrder() {
            const newOrder = [];
            taskList.querySelectorAll("li span").forEach(span => {
                const t = tasks.find(task => task.text === span.textContent);
                if (t) newOrder.push(t);
            });
            tasks = newOrder;
            saveTasks();
        }

        taskList.addEventListener("dragover", e => {
            e.preventDefault();
            const dragging = document.querySelector(".dragging");
            const afterElement = getDragAfterElement(taskList, e.clientY);
            if (afterElement == null) {
                taskList.appendChild(dragging);
            } else {
                taskList.insertBefore(dragging, afterElement);
            }
        });

        function getDragAfterElement(container, y) {
            const elements = [...container.querySelectorAll("li:not(.dragging)")];
            return elements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        addBtn.addEventListener("click", () => {
            if (taskInput.value.trim()) {
                tasks.push({ text: taskInput.value, completed: false });
                taskInput.value = "";
                saveTasks();
                renderTasks();
            }
        });

        searchInput.addEventListener("input", renderTasks);

        filterBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                filterBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                filter = btn.dataset.filter;
                renderTasks();
            });
        });

        darkModeBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
        });

        renderTasks();
    </script>
</body>

</html>
