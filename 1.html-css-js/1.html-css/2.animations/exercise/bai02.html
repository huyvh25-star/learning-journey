<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 200px;
            margin: auto;
            background-color: aliceblue;
            text-align: center;
            box-sizing: border-box;
            padding: 10px;
            animation: boder-move 5s linear infinite alternate;
        }

        @keyframes boder-move {
            0% {
                border-top: 2px solid black;
                border-right: none;
                border-bottom: none;
                border-left: none;
            }

            25% {
                border-top: 2px solid black;
                border-right: 2px solid red;
                border-bottom: none;
                border-left: none;
            }

            50% {
                border-top: 2px solid black;
                border-right: 2px solid red;
                border-bottom: 2px solid yellow;
                border-left: none;
            }

            75% {
                border-top: 2px solid black;
                border-right: 2px solid red;
                border-bottom: 2px solid yellow;
                border-left: 2px solid green;
            }

            100% {
                border-top: 2px solid black;
                border-right: 2px solid red;
                border-bottom: 2px solid yellow;
                border-left: 2px solid green;
            }
        }

        .box {
            width: 200px;
            padding: 20px;
            margin: 50px auto;
            background: aliceblue;
            position: relative;
            text-align: center;
        }

        .box::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            border-top-color: red;
            border-radius: 4px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="title">
            vũ hoàng huy
        </div>
    </div>
</body>

</html>
